<title>页面不存在｜配分语</title>

<!-- 样式内联：404 会在任意深度的路径上显示，不能依赖相对路径的资源 -->
<style>
  :root {
    --ink: #23201c;
    --ink-2: #6b6259;
    --ink-3: #9b928a;
    --line: #ebe2d7;
    --line-2: #f5eee5;
    --orange: #c85f17;
    --orange-d: #a54c11;
    --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC",
      "Source Han Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    --hei: "PingFang SC", "Heiti SC", "Source Han Sans SC", "Noto Sans CJK SC",
      "Microsoft YaHei", "SimHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 clamp(1rem, 4vw, 2rem);
    background: #fbf8f2;
    color: var(--ink);
    font-family: var(--sans);
    font-size: clamp(15.5px, 4.3vw, 16.5px);
    line-height: 1.85;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 1.05rem;
    height: 3.4rem;
    border-bottom: 1px solid var(--line);
    font-size: 0.9rem;
  }
  .bar .brand { color: var(--ink); text-decoration: none; margin-right: auto; font-weight: 600; }
  .bar a { color: var(--ink-2); text-decoration: none; }
  .bar a:hover { color: var(--orange-d); }
  main { max-width: 45rem; margin: 0 auto; padding: 3rem 0 4rem; }
  h1 { font-family: var(--hei); font-size: clamp(1.5rem, 5vw, 1.85rem); margin: 0 0 0.55rem; }
  .meta {
    margin: 0 0 1.6rem;
    padding-bottom: 0.9rem;
    border-bottom: 1px solid var(--line);
    font-size: 0.83rem;
    color: var(--ink-3);
  }
  .entry {
    display: flex;
    flex-direction: column;
    margin: 0 -0.55rem;
    padding: 0.7rem 0.55rem;
    border-bottom: 1px solid var(--line-2);
    border-left: 2px solid transparent;
    border-radius: 6px;
    text-decoration: none;
    color: var(--ink);
  }
  .entry:hover { background: #fdf4ec; border-left-color: var(--orange); }
  .entry .note { font-size: 0.86em; line-height: 1.7; color: var(--ink-3); }
  .foot {
    max-width: 45rem;
    margin: 0 auto;
    padding: 1.6rem 0 2.6rem;
    border-top: 1px solid var(--line);
    font-size: 0.84rem;
    color: var(--ink-2);
  }
</style>
</head>
<body>

<header class="bar">

  <nav aria-label="主站">

  </nav>
